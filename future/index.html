<!DOCTYPE html>
<html lang="cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫の神社</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body{
            background-color: #FFC1CC;
            background-image:
            repeating-linear-gradient(90deg, rgba(100,100,100,0.1) 0 3px, transparent 5px 30px);
        }
        canvas {
         position: fixed;
        top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         pointer-events: none;
         z-index: 900;
            }
        label{
            font-weight: 600;
            display: block;
            font-size:clamp(18px, 3vw, 30px);
            margin-bottom: 1vw;
            color: #FF5A5A;
            text-shadow:   2px 0 white,
                          -2px 0 white,
                           0 2px white,
                           0 -2px white;
        }
        input{
            width: 80%;
            height: 5%;
            background: #C7B6FF;
            color: white;
            border-radius: 10px;
            padding: 5px;
            outline: none;
            border: 5px solid white;
            font-size: clamp(12px, 3vw, 20px);
        }
        input::placeholder{
            color: #E1E1E1;
        }
       .askBtm{
           margin: 2vw ;
           background-color: rgba(255,0,0,1);
       }
        .askBtm:hover{
            color: white;
            background-color: red;
        }
        #result{
            background-color: #C7B6FF;
            height: clamp(120px, 15vh, 300px);
            width: 80%;
            color: black;
            border-radius: 10px;
            padding: 5px;
            outline: none;
            border: 5px solid white;
            font-size: clamp(12px, 3vw, 20px);
            resize: none;
        }
        textarea::placeholder{
            color: #E1E1E1;
        }
    </style>
</head>
<body>
<div id = "HeadLine"></div>
<canvas id="canvas"></canvas>
<div class="card-container" style="justify-content: center;">
    <div class="card" style="background-color: rgba(200,200,250,0.3);">
<h1 style="font-size: clamp(30px,15vw,80px)">🐈‍⛩️🐈‍</h1>
<label for="things">你今天要占卜的事是？</label>
<input id="things" type="text" placeholder="今天能吃到鱼吗？">
    <br>
<button class="askBtm" onclick="getFortune()">抽签</button><br>
    <label for="result" >解签</label><textarea id="result" type="text" readonly placeholder="祝你好运喵"></textarea>
</div>
</div>
<img src="../img/right01.jpg" alt="图没了喵" style="position: fixed;right: 1px;bottom:1px;width: auto;max-height:30vh">
<img src="../img/left01.jpg" alt="图没了喵" style="position: fixed;left: 1px;bottom:1px;width: auto;max-height:30vh">
</body>
<script src="../HeadLine.js"></script>
<script>
addEventListener("load",loadHeadLine)
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// 创建樱花
const petals = [];
const petalCount = 20;

for (let i = 0; i < petalCount; i++) {
  petals.push({
    x: Math.random() * width,
    y: Math.random() * height,
    size: 5 + Math.random() * 10,
    speedY: 1 + Math.random() * 2,
    speedX: Math.random() * 1 - 0.5,
    angle: Math.random() * 360,
    rotationSpeed: Math.random() * 0.02 - 0.01
  });
}

// 绘制樱花
function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);
  ctx.fillStyle = 'pink';
  ctx.beginPath();
  ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, 2 * Math.PI);
  ctx.fill();
  ctx.restore();
}

// 动画循环
function animate() {
  ctx.clearRect(0, 0, width, height);

  for (let p of petals) {
    p.y += p.speedY;
    p.x += p.speedX;
    p.angle += p.rotationSpeed;

    if (p.y > height) {
      p.y = -10;
      p.x = Math.random() * width;
    }

    if (p.x > width) p.x = 0;
    if (p.x < 0) p.x = width;

    drawPetal(p);
  }

  requestAnimationFrame(animate);
}

animate();

//占卜
const playerID = localStorage.getItem('logPlayerID');
const playerName = localStorage.getItem('logPlayerName');
const today = new Date().toLocaleDateString("zh-CN",{timeZone:'Asia/Shanghai'}).replace(/\//g,'-');
addEventListener('load', logCheck);
function logCheck() {
    if (!playerID) {
        alert("请先登录喵")
        window.location.href = "../";
    }
}
const results = [
        //五星文案
     '💖💖💖💖💖:出乎意料的好运喵，本猫觉得你今天很适合{q}喵',
     '💖💖💖💖💖:喵呜～幸运光环围绕你！今天{q}会有意想不到的好结果喵',
     '💖💖💖💖💖:好运喵，本猫看到了彩虹！今天{q}几乎没有阻碍喵',
     '💖💖💖💖💖:幸运指数爆表！今天{q}会顺顺利利喵',
     '💖💖💖💖💖:惊喜喵！本猫觉得今天{q}会让你开心到尾巴翘起来喵',
        //四星文案
     '💖💖💖💖:好运喵，据说{q}的时候心里喵喵叫就不会有问题了喵',
     '💖💖💖💖:今天的幸运之星眨眼了几次喵，{q}进行得挺顺利的喵',
     '💖💖💖💖:轻轻松松的好运气，今天{q}不难过喵',
     '💖💖💖💖:本猫觉得{q}会比你想的顺利一些喵',
     '💖💖💖💖:喵喵提示：今天{q}有一丝小幸运环绕喵',
        //三星文案
     '💖💖💖:喵呜，本猫也感觉困惑了喵，{q}这件事似乎喜忧参半呢',
     '💖💖💖:普通喵，{q}可能有惊喜，也可能有小波折喵',
     '💖💖💖:本猫观察到，{q}可能有开心也有小小小挑战喵',
     '💖💖💖:谨慎喵～今天{q}得自己小心一点喵',
     '💖💖💖:本猫觉得今天{q}是平平稳稳的喵，但也不坏喵',
        //二星文案
     '💖💖:如果你是个冒险家的话，值得在今天尝试下{q}喵',
     '💖💖:本猫觉得{q}今天有点小波折，谨慎尝试喵',
     '💖💖:轻轻冒险喵～{q}可能会有意料之外的结果喵',
     '💖💖:冒险喵！今天{q}有点小风险，但别太紧张喵',
     '💖💖:本猫看到微风喵～{q}要小心一点喵',
        //一星文案
     '💖:恐怖喵，本猫建议你今天最好不要{q}喵',
     '💖:小心喵！{q}可能容易出问题喵',
     '💖:本猫提醒你，今天如果一定要{q}，最好谨慎为妙喵',
     '💖:冒险指数很高喵，{q}最好延期喵',
     '💖:喵呜～本猫看到了小麻烦，今天不要轻易尝试{q}喵'
    ];
function hashString(str) {
  let hash = 2166136261;
  for (let i = 0; i < str.length; i++) {
    hash ^= str.charCodeAt(i);
    hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
  }
  return hash >>> 0;
}

function seededRandom(s) {
  s = (s * 9301 + 49297) % 233280;
  return s / 233280;
}
function getFortune() {
  const question = document.getElementById('things').value
    if (!question) {
        alert("不可以什么也不问喵!")
        return
    }
  const seed = hashString(question + today + playerID);
  const index = Math.floor(seededRandom(seed) * results.length);
  const text = results[index].replace('{q}',question);
  document.getElementById('result').value = `由于你的虔诚参拜，猫咪回应你:
  ${text}。
  (${playerName}于${today}参拜)`;
}
</script>
</html>
